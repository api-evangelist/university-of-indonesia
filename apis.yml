apis:
  - aid: university-of-indonesia:api-gateway
    name: UI API Gateway (Kong Enterprise)
    description: >-
      api.ui.ac.id is a Kong Enterprise 3.3.1.0 API gateway operated by the
      university on its own network. Every probed path — /, /v1, /status,
      /docs, /openapi.json, /oauth2/token, /.well-known/openid-configuration —
      returns HTTP 401 with a JSON body {"message":"Unauthorized"} and the
      Kong response headers (server: kong/3.3.1.0-enterprise-edition,
      x-kong-response-latency, access-control-expose-headers naming
      X-Kong-Proxy-Latency and X-Kong-Upstream-Latency). The gateway is real
      and institution-operated; its routes, its consumers and any contract
      describing them are private. No specification has been generated to
      stand in for one.
    humanURL: https://api.ui.ac.id/
    baseURL: https://api.ui.ac.id/
    tags: [ API Gateway, Kong, Authentication, Private ]
    x-operator: institution
    x-operator-basis: >-
      api.ui.ac.id is under ui.ac.id, the university's own registrable domain, with no CNAME.
      It resolves to 152.118.148.211, inside 152.118.0.0/16, registered at APNIC as netname
      INDONESIAUNI-ID, descr "University of Indonesia", country ID. Kong is self-hosted
      software, not a hosted vendor tenancy, and no vendor identity appears in the host,
      the DNS chain or the response bodies.
    properties:
      - type: BaseURL
        url: https://api.ui.ac.id/
  - aid: university-of-indonesia:sso-cas
    name: SSO UI (CAS Single Sign-On)
    description: >-
      Sistem Akun UI, the university-wide Single Sign-On, implemented with the
      Apereo CAS protocol at sso.ui.ac.id. https://sso.ui.ac.id/ redirects to
      /cas/login and returns a live CAS login form (title "SSO UI", Indonesian
      and English prompts, jsessionid-rewritten theme assets under
      /cas/themes/ui/). Campus applications delegate to it — beranda.ui.ac.id
      bounces an unauthenticated request to
      /cas/login?service=http%3A%2F%2Fberanda.ui.ac.id%2F… — so the ticket
      validation surface is in production use. It is not, however, publicly
      documented: /cas/p3/serviceValidate, /cas/idp/metadata and
      /cas/oidc/.well-known/openid-configuration all return the same HTML
      login page with HTTP 200 rather than a CAS/SAML/OIDC payload, which is a
      soft-200 and not evidence of those endpoints. No SAML 2.0 or Shibboleth
      identity-provider metadata was found for UI in any federation aggregate,
      and Indonesia has no eduGAIN member federation.
    humanURL: https://sso.ui.ac.id/
    baseURL: https://sso.ui.ac.id/cas/
    tags: [ Authentication, SSO, CAS, Identity ]
    x-operator: institution
    x-operator-basis: >-
      sso.ui.ac.id is under ui.ac.id with no CNAME, resolving to 152.118.148.213 inside the
      university's own APNIC allocation 152.118.0.0/16 (INDONESIAUNI-ID). Apereo CAS is
      open-source software the university runs itself; the theme, logo and Indonesian-language
      copy are UI's own.
    properties:
      - type: BaseURL
        url: https://sso.ui.ac.id/cas/login
  - aid: university-of-indonesia:emas2-moodle
    name: EMAS2 Learning Platform (Moodle Web Services + LTI 1.3)
    description: >-
      EMAS2 (E-learning Management System) at emas2.ui.ac.id is an
      institution-hosted Moodle instance. Three machine surfaces answer
      anonymously and identify themselves as live-but-gated rather than
      absent: /webservice/rest/server.php returns HTTP 200 application/xml
      with <EXCEPTION class="moodle_exception"><ERRORCODE>invalidtoken</…>,
      /login/token.php returns HTTP 200 application/json
      {"errorcode":"missingparam"} for the token-issuance call, and
      /lib/ajax/service.php returns a Moodle JSON coding error. /mod/lti/auth.php
      returns a populated LTI 1.3 OIDC authorization response form, which is
      the education-regime `lti` conformance evidence recorded in
      conformance/. There is no public token issuance, no enrolled-service
      documentation and no published function list; the contract itself is
      Moodle's product contract, not a UI-authored one, so none is stored here.
    humanURL: https://emas2.ui.ac.id/
    baseURL: https://emas2.ui.ac.id/webservice/rest/server.php
    tags: [ Learning Management, Moodle, LTI, Education, Private ]
    x-operator: institution
    x-operator-basis: >-
      emas2.ui.ac.id is under ui.ac.id with no CNAME and resolves to 152.118.24.145, inside
      the university's own APNIC allocation 152.118.0.0/16 (INDONESIAUNI-ID). Moodle is
      open-source software self-hosted on UI infrastructure — the pluginfile.php theme assets
      are served from the same host — not a vendor-hosted tenancy such as MoodleCloud.
    properties:
      - type: BaseURL
        url: https://emas2.ui.ac.id/webservice/rest/server.php
  - aid: university-of-indonesia:scholarhub-oai
    name: UI Scholars Hub OAI-PMH (bepress Digital Commons tenant)
    description: >-
      OAI-PMH 2.0 metadata-harvesting interface for UI Scholars Hub, the
      university's institutional research repository. Verified live:
      ?verb=Identify returns repositoryName "UI Scholars Hub",
      protocolVersion 2.0, repositoryIdentifier scholarhub.ui.ac.id,
      earliestDatestamp 2000-01-19, granularity YYYY-MM-DDThh:mm:ssZ;
      ?verb=ListMetadataFormats returns nine prefixes including oai_dc,
      qualified-dublin-core, oai_etdms and oai_openaire; ?verb=ListSets returns
      115 sets. The content and the sets are UI's. The platform is not:
      scholarhub.ui.ac.id is a CNAME onto bepress and the Identify response
      names adminEmail dc-support@elsevier.com. Recorded as a tenant
      relationship; the Digital Commons contract belongs in bepress/Elsevier's
      own repository, not this one.
    humanURL: https://scholarhub.ui.ac.id/
    baseURL: https://scholarhub.ui.ac.id/do/oai/
    tags: [ Research Repository, OAI-PMH, Research, Metadata, Open Access ]
    x-operator: tenant
    x-operator-basis: >-
      CNAME tenancy. scholarhub.ui.ac.id CNAMEs to dcuischolarhub.bepress.com (bepress.com,
      203.22.241.42/43) — a host rule reading only the registrable domain ui.ac.id would
      credit this to the institution. The OAI-PMH Identify response independently confirms the
      operator with adminEmail dc-support@elsevier.com. UI is the tenant; bepress/Elsevier
      Digital Commons is the operator.
    properties:
      - type: Documentation
        url: https://scholarhub.ui.ac.id/
      - type: BaseURL
        url: https://scholarhub.ui.ac.id/do/oai/
  - aid: university-of-indonesia:pure-portal
    name: UI Research Portal (Elsevier Pure tenant)
    description: >-
      scholar.ui.ac.id is University of Indonesia's Elsevier Pure Portal —
      HTTP response header x-product "Pure Portal", title "Universitas
      Indonesia", Elsevier CSP origins. It carries two machine surfaces:
      /ws/oai, an OAI-PMH 2.0 provider whose Identify response reports
      repositoryName "Pure OAI Repository", adminEmail purehosted@elsevier.com
      and an OpenAIRE CERIF 1.2 profile with six metadata prefixes; and
      /ws/api, which serves an OpenAPI 3.0.1 description titled "Pure API",
      version 5.36.2-1, contact pure-support@elsevier.com, servers [{url:
      /ws/api}] and 827 paths. That specification is Elsevier's product
      contract, is byte-identical across every Pure customer, has a relative
      servers[] block that makes it invisible to a host-based ownership check,
      and is NOT stored in this repository. The tenancy is the fact recorded
      here; the data is UI's, the contract is Elsevier's.
    humanURL: https://scholar.ui.ac.id/
    baseURL: https://scholar.ui.ac.id/ws/oai
    tags: [ Research Repository, CRIS, OAI-PMH, Research, Metadata ]
    x-operator: tenant
    x-operator-basis: >-
      CNAME tenancy, not in the pre-computed audit list. scholar.ui.ac.id CNAMEs to
      ui.elsevierpure.com, which CNAMEs to apac.prod.elsevierpure.com and on to Cloudflare.
      The hostname is under ui.ac.id, so every host-based verdict reads `institution` and
      over-credits UI with Elsevier's engineering. Confirmed independently by the response
      header x-product: Pure Portal, by the OAI adminEmail purehosted@elsevier.com and by
      info.contact.email pure-support@elsevier.com in the served OpenAPI.
    properties:
      - type: Documentation
        url: https://scholar.ui.ac.id/
      - type: BaseURL
        url: https://scholar.ui.ac.id/ws/oai
  - aid: university-of-indonesia:lontar-opac
    name: LONTAR Library OPAC
    description: >-
      The University of Indonesia Library online public access catalogue,
      served at lib.ui.ac.id (lontar.ui.ac.id redirects to it), title
      "OPAC - Universitas Indonesia Library". LONTAR is library software
      developed at UI and run on UI infrastructure. The catalogue is a
      human-facing web application: no OAI-PMH provider, SRU/Z39.50 endpoint,
      JSON export or machine-readable contract was found on the host, so it is
      recorded as an institution-operated surface with no API, not as an API.
    humanURL: https://lib.ui.ac.id/
    tags: [ Library, Library Catalog, Discovery ]
    x-operator: institution
    x-operator-basis: >-
      lib.ui.ac.id and lontar.ui.ac.id both resolve to 152.118.147.93 with no CNAME, inside
      the university's own APNIC allocation 152.118.0.0/16 (INDONESIAUNI-ID). No Ex Libris,
      OCLC, Koha-hosted or other vendor signature appears in the host, the DNS chain or the
      served HTML.
  - aid: university-of-indonesia:crossref-member
    name: Crossref Member 4386 (Universitas Indonesia)
    description: >-
      University of Indonesia is a Crossref member and DOI registrant. Verified
      against the Crossref REST API: https://api.crossref.org/members/4386
      returns primary-name "Universitas Indonesia", location "Universitas
      Indonesia, Indonesia", prefixes ["10.7454"] and counts
      {current-dois 2395, backfile-dois 10359, total-dois 12754};
      https://api.crossref.org/prefixes/10.7454 resolves the prefix back to
      member 4386. This is a registry MEMBERSHIP — a fact about the
      institution — and never a Crossref contract attributed to UI.
    humanURL: https://api.crossref.org/members/4386
    tags: [ Registry, DOI, Crossref, Research, Metadata ]
    x-operator: registry
    x-operator-basis: >-
      api.crossref.org is an identifier registry the institution is registered IN, shared by
      every Crossref member by design. The membership id (4386) and DOI prefix (10.7454) are
      UI's; the API is Crossref's and is not stored here.
  - aid: university-of-indonesia:ror
    name: ROR Identifier 0116zj450
    description: >-
      Research Organization Registry record for University of Indonesia,
      https://ror.org/0116zj450, verified against the ROR v2 API with
      ror_display name "University of Indonesia" and links
      http://www.ui.ac.id/. The identifier is the institution's; the registry
      API is ROR's.
    humanURL: https://ror.org/0116zj450
    tags: [ Registry, Identifier, ROR, Research ]
    x-operator: registry
    x-operator-basis: >-
      api.ror.org is an identifier registry the institution is registered IN. Shared by every
      registered organization by definition; recording the membership is correct, saving the
      registry's contract as UI's would not be.
