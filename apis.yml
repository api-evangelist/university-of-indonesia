x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    University of Indonesia operates real machine surfaces on its own network and publishes
    a contract for none of them. api.ui.ac.id is a Kong Enterprise 3.3.1.0 gateway that
    answers HTTP 401 {"message":"Unauthorized"} on every probed path including /docs and
    /openapi.json; the institution-hosted Moodle at emas2.ui.ac.id answers
    /webservice/rest/server.php with a moodle_exception invalidtoken and /login/token.php
    with missingparam, both live and both token-gated; sso.ui.ac.id serves a working CAS
    login but returns the same HTML page with HTTP 200 for /cas/p3/serviceValidate,
    /cas/idp/metadata and /cas/oidc/.well-known/openid-configuration, which is a soft-200,
    not a documented endpoint. No developer portal, API reference, OpenAPI, key issuance or
    client registration exists anywhere on ui.ac.id, and none has been generated to stand in
    for one. The two surfaces that DO answer anonymously — the OAI-PMH providers on
    scholarhub.ui.ac.id and scholar.ui.ac.id — are vendor tenancies (bepress Digital Commons
    and Elsevier Pure) recorded as such rather than credited to UI. A secondary obstacle,
    which does not change the finding: www.ui.ac.id sits behind an F5 Shape/TSPD JavaScript
    interstitial that returns HTTP 200 with a bot-defense body for every path, so
    /robots.txt, /llms.txt, /.well-known/security.txt and invented paths all "succeed" and
    none of them was treated as evidence.
