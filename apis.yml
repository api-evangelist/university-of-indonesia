aid: university-of-indonesia
name: University of Indonesia
x-type: university
x-category: Public Research University
description: >-
  University of Indonesia (Universitas Indonesia, UI) is a public research
  university in Depok and Salemba, Jakarta, the highest-ranked university in
  Indonesia. Its programmable footprint is real but almost entirely closed. UI
  operates its own Kong Enterprise API gateway at api.ui.ac.id on its own
  network allocation (152.118.0.0/16, APNIC "INDONESIAUNI-ID"), a campus-wide
  CAS Single Sign-On at sso.ui.ac.id, an institution-hosted Moodle learning
  platform at emas2.ui.ac.id exposing Moodle Web Services and an LTI 1.3
  platform endpoint, and the LONTAR library OPAC at lib.ui.ac.id. Every one of
  those is credential-gated: the gateway answers 401 {"message":"Unauthorized"}
  on every probed path, the LMS web service rejects anonymous calls with
  invalidtoken, and no developer portal, API reference, OpenAPI description,
  key issuance or client registration exists anywhere on the public surface.
  The two research-discovery surfaces that DO answer anonymously are vendor
  tenancies on UI hostnames, not UI engineering — scholarhub.ui.ac.id CNAMEs to
  bepress (Digital Commons) and scholar.ui.ac.id CNAMEs to ui.elsevierpure.com
  (Elsevier Pure Portal) — and are recorded here as tenant relationships with
  the vendor contracts deliberately left in the vendors' own repositories. UI is
  a Crossref member (4386, prefix 10.7454) and carries a ROR identifier. The
  main web estate at www.ui.ac.id sits behind an F5 bot-defense interstitial
  that returns HTTP 200 for every path including ones that do not exist, so no
  claim in this profile rests on a status code from that host.
