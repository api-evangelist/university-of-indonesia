apis:
  - aid: university-of-indonesia:scholarhub-oai
    name: UI Scholars Hub OAI-PMH
    description: >-
      Open Archives Initiative Protocol for Metadata Harvesting (OAI-PMH 2.0)
      interface for UI Scholars Hub, the University of Indonesia institutional
      research repository running on the Digital Commons (bepress) platform.
      The endpoint returns standards-based Dublin Core metadata for theses,
      dissertations, articles, and other scholarly works and supports the
      standard verbs (Identify, ListRecords, ListSets, GetRecord, etc.).
      Verified live returning a valid OAI-PMH Identify response (repositoryName
      "UI Scholars Hub", protocolVersion 2.0).
    humanURL: https://scholarhub.ui.ac.id/
    baseURL: https://scholarhub.ui.ac.id/do/oai/
    tags: [ Repository, OAI-PMH, Research, Metadata, Open Access ]
    properties:
      - type: Documentation
        url: https://scholarhub.ui.ac.id/
      - type: BaseURL
        url: https://scholarhub.ui.ac.id/do/oai/
  - aid: university-of-indonesia:sso-cas
    name: SSO UI (CAS Authentication)
    description: >-
      Sistem Akun UI, the university-wide Single Sign-On service, implemented
      using the CAS (Central Authentication Service) protocol at sso.ui.ac.id.
      It authenticates UI civitas academica across integrated campus IT
      resources. The login endpoint is publicly reachable, but there is no
      public, self-service developer documentation or client-registration
      portal; integration is gated and arranged internally with UI IT.
    humanURL: https://sso.ui.ac.id/
    tags: [ Authentication, SSO, CAS, Identity ]
    properties:
      - type: Documentation
        url: https://sso.ui.ac.id/account/node/3
