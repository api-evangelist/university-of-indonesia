aid: university-of-indonesia
name: University of Indonesia
description: >-
  University of Indonesia (Universitas Indonesia, UI) is a public research
  university based in Depok and Salemba, Jakarta, ranked #206 in the QS World
  University Rankings 2025 and the highest-ranked university in Indonesia. Its
  public, machine-readable developer footprint is limited: UI Scholars Hub, the
  institutional research repository hosted on the Digital Commons (bepress)
  platform, exposes a live OAI-PMH 2.0 metadata interface for harvesting
  scholarly works, and the campus-wide Single Sign-On runs on CAS (Central
  Authentication Service). No public, self-service developer portal with
  documented REST endpoints or API keys was found; academic, library, and
  identity systems are gated behind institutional credentials.
